              <rect x="292" y="238" width="48" height="34" rx="4"/><rect x="350" y="238" width="48" height="34" rx="4"/>
              <rect x="408" y="238" width="48" height="34" rx="4"/><rect x="466" y="238" width="48" height="34" rx="4"/>
              <rect x="524" y="238" width="56" height="34" rx="4"/>
              <rect x="88" y="282" width="48" height="34" rx="4"/><rect x="146" y="282" width="48" height="34" rx="4"/>
              <rect x="204" y="282" width="48" height="34" rx="4"/><rect x="262" y="282" width="48" height="34" rx="4"/>
