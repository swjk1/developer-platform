                <stop offset="0" stop-color="#2A1C22"/><stop offset="1" stop-color="#120D10"/>
              </linearGradient>
            </defs>
            <rect width="640" height="360" fill="url(#kgbg)"/>

            <!-- message field -->
            <rect x="60" y="48" width="520" height="96" rx="6" fill="#1D1418" stroke="#3A2A31"/>
