# Shared configuration. Anything environment-specific lives in a profile file,
# and anything secret comes from the environment (spec section 75).
spring:
  application:
    name: developer-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:platform}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate is only allowed to check that the
      # mapping still matches it, never to change it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # Section 63: health and metrics only. Nothing that lets the internet
        # read configuration or trigger a shutdown.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    enabled: false

github:
  base-url: ${GITHUB_API_URL:https://api.github.com}
  # Optional. Unauthenticated is 60 requests/hour, authenticated is 5000.
  # The three repositories here need six calls per sync, so unauthenticated
  # is workable; a token mostly buys headroom.
  token: ${GITHUB_TOKEN:}
  interval: ${GITHUB_SYNC_INTERVAL:PT30M}
  initial-delay: PT1M
  sync-on-startup: ${GITHUB_SYNC_ON_STARTUP:false}
  connect-timeout: PT2S
  read-timeout: PT5S
  max-attempts: 3
  # 500 ms, 1 s, 2 s — the schedule in spec section 12.
  retry-base: PT0.5S
  retry-max: PT10S
  retry-jitter: 0.2

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    com.leon: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n"
